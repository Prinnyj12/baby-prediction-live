<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Prediction Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f5efe4;
      color: #3d352c;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       VOTING SCREEN
    ========================= */

    .vote-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background:
        radial-gradient(circle at top, #fffaf0 0%, #f5efe4 55%, #e9ddc9 100%);
    }

    .vote-card {
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,0.95);
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(80,60,40,0.18);
    }

    .flame {
      font-size: 45px;
    }

    .vote-card h1 {
      font-size: 38px;
      margin: 8px 0;
    }

    .subtitle {
      font-size: 19px;
      margin-bottom: 30px;
      color: #756858;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin: 20px 0 8px;
      font-size: 18px;
    }

    input[type="text"] {
      width: 100%;
      padding: 17px;
      border: 2px solid #d8c9b4;
      border-radius: 14px;
      font-size: 20px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #a99070;
    }

    .guess-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 12px;
    }

    .guess-button {
      border: 4px solid transparent;
      border-radius: 20px;
      padding: 25px 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 25px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .guess-button:hover {
      transform: translateY(-2px);
    }

    .boy {
      background: #dcefff;
      color: #2872a8;
    }

    .girl {
      background: #ffe1eb;
      color: #c4557c;
    }

    .guess-button.selected {
      border-color: #3d352c;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .cast-button {
      width: 100%;
      margin-top: 25px;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #3d352c;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .cast-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .message {
      min-height: 25px;
      margin-top: 15px;
      color: #b13f3f;
      font-weight: bold;
    }

    /* =========================
       THANK YOU SCREEN
    ========================= */

    .thank-you {
      display: none;
      text-align: center;
    }

    .thank-you h2 {
      font-size: 38px;
    }

    .thank-you .team {
      font-size: 55px;
      margin: 30px 0;
    }

    /* =========================
       TV SCREEN
    ========================= */

    .tv-page {
      min-height: 100vh;
      background:
        linear-gradient(rgba(45,34,24,.75), rgba(45,34,24,.75)),
        #6e5239;
      color: white;
      padding: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tv-container {
      width: 100%;
      max-width: 1400px;
      text-align: center;
    }

    .tv-title {
      font-size: clamp(35px, 5vw, 75px);
      margin: 0 0 8px;
      letter-spacing: 2px;
    }

    .tv-subtitle {
      font-size: clamp(18px, 2vw, 28px);
      color: #eadbc5;
      margin-bottom: 35px;
    }

    .vote-total {
      font-size: clamp(20px, 2.5vw, 32px);
      margin-bottom: 35px;
    }

    .result-card {
      background: rgba(255,255,255,.96);
      color: #3d352c;
      border-radius: 28px;
      padding: 30px;
      margin-bottom: 35px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    .result-row {
      display: grid;
      grid-template-columns: 170px 1fr 120px;
      align-items: center;
      gap: 20px;
      margin: 22px 0;
      text-align: left;
    }

    .team-name {
      font-size: clamp(22px, 3vw, 38px);
      font-weight: bold;
    }

    .boy-text {
      color: #2872a8;
    }

    .girl-text {
      color: #c4557c;
    }

    .bar-background {
      height: 35px;
      background: #e6ded3;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      border-radius: 20px;
      transition: width 1s ease;
    }

    .boy-bar {
      background: linear-gradient(90deg, #8dc8f2, #2872a8);
    }

    .girl-bar {
      background: linear-gradient(90deg, #f7a9c4, #c4557c);
    }

    .percentage {
      font-size: clamp(30px, 4vw, 55px);
      font-weight: bold;
      text-align: right;
    }

    /* Prediction Meter */

    .meter-title {
      font-size: clamp(24px, 3vw, 40px);
      margin: 25px 0 20px;
    }

    .meter {
      position: relative;
      height: 25px;
      border-radius: 20px;
      background: linear-gradient(
        90deg,
        #c4557c 0%,
        #f7a9c4 25%,
        #d8d1c8 50%,
        #8dc8f2 75%,
        #2872a8 100%
      );
      margin: 50px 30px 15px;
    }

    .meter-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 58px;
      height: 58px;
      background: white;
      border: 5px solid #3d352c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      transition: left 1s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,.3);
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: clamp(12px, 1.5vw, 19px);
      color: #756858;
      margin: 0 20px;
    }

    .prediction {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: bold;
      margin-top: 30px;
    }

    .waiting {
      font-size: 28px;
      color: #eadbc5;
    }

    @media (max-width: 700px) {
      .result-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .percentage {
        text-align: left;
      }

      .meter-labels {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       VOTING PAGE
  ========================== -->

  <div id="votePage" class="vote-page">

    <div class="vote-card">

      <div id="voteForm">

        <div class="flame">🔥</div>

        <h1>What's Cooking?</h1>

        <div class="subtitle">
          What do you think Baby will be?
        </div>

        <label for="guestName">Your Name</label>

        <input
          type="text"
          id="guestName"
          placeholder="Enter your name"
          maxlength="50"
          autocomplete="off"
        >

        <label>Make Your Prediction</label>

        <div class="guess-buttons">

          <button
            class="guess-button boy"
            id="boyButton"
            onclick="selectGuess('boy')">
            💙<br>BOY
          </button>

          <button
            class="guess-button girl"
            id="girlButton"
            onclick="selectGuess('girl')">
            💗<br>GIRL
          </button>

        </div>

        <div id="message" class="message"></div>

        <button
          class="cast-button"
          id="castButton"
          onclick="castVote()">
          CAST MY VOTE
        </button>

      </div>

      <div id="thankYou" class="thank-you">

        <div class="flame">🔥</div>

        <h2>Thanks, <span id="thankName"></span>!</h2>

        <p>You are officially on...</p>

        <div id="thankTeam" class="team"></div>

        <p>Good luck! 👶</p>

      </div>

    </div>

  </div>


  <!-- =========================
       TV PAGE
  ========================== -->

  <div id="tvPage" class="tv-page" style="display:none;">

    <div class="tv-container">

      <h1 class="tv-title">🔥 BABY PREDICTION LIVE 🔥</h1>

      <div class="tv-subtitle">
        What's Cooking?
      </div>

      <div id="voteTotal" class="vote-total">
        0 Votes Cast
      </div>

      <div class="result-card">

        <div class="result-row">

          <div class="team-name boy-text">
            💙 TEAM BOY
          </div>

          <div class="bar-background">
            <div
              id="boyBar"
              class="bar boy-bar"
              style="width:0%">
            </div>
          </div>

          <div id="boyPercentage" class="percentage boy-text">
            0%
          </div>

        </div>


        <div class="result-row">

          <div class="team-name girl-text">
            💗 TEAM GIRL
          </div>

          <div class="bar-background">
            <div
              id="girlBar"
              class="bar girl-bar"
              style="width:0%">
            </div>
          </div>

          <div id="girlPercentage" class="percentage girl-text">
            0%
          </div>

        </div>


        <div class="meter-title">
          🔥 PREDICTION METER
        </div>

        <div class="meter">

          <div
            id="meterMarker"
            class="meter-marker"
            style="left:50%">
            🔥
          </div>

        </div>

        <div class="meter-labels">
          <span>Strong Girl</span>
          <span>Lean Girl</span>
          <span>EVEN</span>
          <span>Lean Boy</span>
          <span>Strong Boy</span>
        </div>

        <div id="prediction" class="prediction">
          ⚖️ EVEN
        </div>

      </div>

      <div class="waiting">
        Live results update automatically
      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================== -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBraozreBizQaGWOhISI9pyHvKZ_aDZKp0",

      authDomain:
        "live-gender-prediction.firebaseapp.com",

      projectId:
        "live-gender-prediction",

      storageBucket:
        "live-gender-prediction.firebasestorage.app",

      messagingSenderId:
        "326710255997",

      appId:
        "1:326710255997:web:22339baf2da24f1dc5ac14",

      measurementId:
        "G-QQHNVVQFS4"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    let selectedGuess = null;


    /* =========================
       DETERMINE WHICH SCREEN
    ========================== */

    const params =
      new URLSearchParams(window.location.search);

    const isTV =
      params.get("screen") === "tv";


    if (isTV) {

      document.getElementById("votePage").style.display = "none";

      document.getElementById("tvPage").style.display = "flex";

      startTV();

    }


    /* =========================
       VOTING
    ========================== */

    window.selectGuess = function(guess) {

      selectedGuess = guess;

      document
        .getElementById("boyButton")
        .classList.toggle(
          "selected",
          guess === "boy"
        );

      document
        .getElementById("girlButton")
        .classList.toggle(
          "selected",
          guess === "girl"
        );

      document.getElementById("message").textContent = "";

    };


    window.castVote = async function() {

      const name =
        document
          .getElementById("guestName")
          .value
          .trim();

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("castButton");


      if (!name) {

        message.textContent =
          "Please enter your name.";

        return;

      }


      if (!selectedGuess) {

        message.textContent =
          "Please choose Boy or Girl.";

        return;

      }


      button.disabled = true;

      button.textContent =
        "SUBMITTING...";


      try {

        /*
          IMPORTANT:
          We intentionally do NOT save the guest's
          name to Firestore. It is only used locally
          for the thank-you message.
        */

        await addDoc(
          collection(db, "votes"),
          {
            guess: selectedGuess,
            createdAt: serverTimestamp()
          }
        );


        document
          .getElementById("voteForm")
          .style.display = "none";

        document
          .getElementById("thankYou")
          .style.display = "block";

        document
          .getElementById("thankName")
          .textContent = name;

        document
          .getElementById("thankTeam")
          .textContent =
            selectedGuess === "boy"
              ? "💙 TEAM BOY"
              : "💗 TEAM GIRL";


        /*
          Reset the iPad automatically after 4 seconds
          for the next guest.
        */

        setTimeout(() => {

          window.location.reload();

        }, 4000);


      } catch (error) {

        console.error(error);

        message.textContent =
          "Oops! Your vote didn't go through. Please try again.";

        button.disabled = false;

        button.textContent =
          "CAST MY VOTE";

      }

    };


    /* =========================
       TV RESULTS
    ========================== */

    function startTV() {

      const votesRef =
        collection(db, "votes");


      onSnapshot(votesRef, (snapshot) => {

        let boyVotes = 0;

        let girlVotes = 0;


        snapshot.forEach((doc) => {

          const vote =
            doc.data().guess;

          if (vote === "boy") {
            boyVotes++;
          }

          if (vote === "girl") {
            girlVotes++;
          }

        });


        updateResults(
          boyVotes,
          girlVotes
        );

      });

    }


    function updateResults(
      boyVotes,
      girlVotes
    ) {

      const total =
        boyVotes + girlVotes;


      let boyPercent = 0;
      let girlPercent = 0;


      if (total > 0) {

        boyPercent =
          Math.round(
            (boyVotes / total) * 100
          );

        girlPercent =
          100 - boyPercent;

      }


      document
        .getElementById("voteTotal")
        .textContent =
          `${total} ${total === 1 ? "Vote" : "Votes"} Cast`;


      document
        .getElementById("boyPercentage")
        .textContent =
          `${boyPercent}%`;


      document
        .getElementById("girlPercentage")
        .textContent =
          `${girlPercent}%`;


      document
        .getElementById("boyBar")
        .style.width =
          `${boyPercent}%`;


      document
        .getElementById("girlBar")
        .style.width =
          `${girlPercent}%`;


      /*
        Prediction meter:
        0% = Strong Girl
        50% = Even
        100% = Strong Boy
      */

      const meterPosition =
        boyPercent;


      document
        .getElementById("meterMarker")
        .style.left =
          `${meterPosition}%`;


      let prediction = "";


      if (total === 0) {

        prediction = "⚖️ EVEN";

      } else if (boyPercent === girlPercent) {

        prediction = "⚖️ EVEN";

      } else if (boyPercent >= 85) {

        prediction = "💙 STRONG BOY";

      } else if (boyPercent >= 60) {

        prediction = "💙 LEAN BOY";

      } else if (girlPercent >= 85) {

        prediction = "💗 STRONG GIRL";

      } else if (girlPercent >= 60) {

        prediction = "💗 LEAN GIRL";

      } else {

        prediction = "⚖️ SLIGHT LEAN";

      }


      document
        .getElementById("prediction")
        .textContent =
          prediction;

    }

  </script>

</body>
</html>
